backend:
  name: git-gateway
  branch: main

media_folder: "public/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "blog"
    label: "Últimos Casos"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Categoria", name: "category", widget: "select",
          options: ["Usucapião", "Locação", "Imobiliário", "Família", "Consumidor"] }
      - { label: "Imagem de capa", name: "image", widget: "image", required: false }
      - { label: "Texto", name: "body", widget: "markdown" }